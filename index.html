<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f2">
<link rel="manifest" href="manifest.webmanifest">
<title>生物ランダム図鑑</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#26352c;background:#f4f7f2}
*{box-sizing:border-box}body{margin:0;padding:14px 12px 40px;max-width:900px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;margin:8px 0}
.panel{background:white;border:1px solid #e1e9df;border-radius:14px;padding:12px;margin:12px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;border:1px solid #cbd8ca;border-radius:10px;padding:9px;background:#fff;color:inherit}
button.primary{background:#315e42;color:#fff;border-color:#315e42;font-weight:700}
button:disabled{opacity:.45}
input[type=number]{width:70px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f5f8f3;border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:#617064}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:white;border:1px solid #e2e9e0;border-radius:11px;overflow:hidden;min-width:0;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#e9eee7}
.card .name{font-size:12px;font-weight:700;padding:6px 7px 1px;line-height:1.35;overflow-wrap:anywhere}
.card .sci{font-size:10px;color:#718074;padding:0 7px 7px;font-style:italic;overflow-wrap:anywhere}
.muted{color:#6d7b70;font-size:12px;line-height:1.5}
.status{font-size:12px;min-height:18px;color:#526457}
.progress{height:7px;background:#e7eee5;border-radius:9px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;background:#6b9a70;width:0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:5}.sheet{background:white;border-radius:18px 18px 0 0;padding:18px;max-width:600px;width:100%;margin:auto;max-height:82vh;overflow:auto}
.sheet h2{font-size:18px}.sheet a{color:#28613d}.sheet .close{float:right}
@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.card .name{font-size:13px}}
</style>
</head>
<body>
<header><h1>生物ランダム図鑑</h1><span class="muted">拡張版</span></header>
<section class="panel">
 <div class="stats">
  <div class="stat"><b id="registered">0</b><small>登録済み種</small></div>
  <div class="stat"><b id="remaining">0</b><small>未抽選候補</small></div>
  <div class="stat"><b id="drawn">0</b><small>累計抽選数</small></div>
 </div>
 <div class="row" style="margin-top:12px">
  <label>抽選数 <input id="count" type="number" min="1" max="20" value="9"></label>
  <label><input id="exclude" type="checkbox" checked> 抽選済みを除外</label>
  <button class="primary" id="draw">抽選する</button>
  <button id="more">候補を追加取得</button>
 </div>
 <div class="row" style="margin-top:8px">
  <label><input id="auto" type="checkbox"> 自動抽選</label>
  <label>間隔 <select id="interval"><option value="5">5秒</option><option value="10" selected>10秒</option><option value="20">20秒</option><option value="30">30秒</option></select></label>
  <button id="reset">抽選履歴をリセット</button>
 </div>
 <div class="progress"><i id="bar"></i></div>
 <div class="status" id="status">準備完了。候補を追加取得すると図鑑が広がります。</div>
 <div class="muted">日本語名・写真が確認できた種だけを登録します。データはこの端末内に保存されます。</div>
</section>
<section id="cards" class="grid"></section>
<section class="panel">
 <b>候補データの拡張について</b>
 <p class="muted">分類群ごとにiNaturalistから少しずつ取得します。APIへの負荷を抑えるため、取得間隔を空け、登録済みの種は重複登録しません。10,000種は目標値であり、取得できた日本語名・写真付き種の実数を表示します。</p>
 <div class="row"><button id="export">データを書き出す</button><label>読込 <input id="import" type="file" accept="application/json"></label></div>
</section>
<div class="modal" id="modal"><div class="sheet">
 <button class="close" id="close">閉じる</button><div id="detail"></div>
</div></div>
<script src="app.js"></script>
</body></html>
